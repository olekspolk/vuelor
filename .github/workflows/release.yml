name: Publish packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency order matters: @vuelor/gradient builds and publishes against
      # the picker's fresh dist (workspace:^ is rewritten to the picker's real
      # version by pnpm at pack time).
      - name: Build packages
        run: |
          pnpm --filter @vuelor/picker build
          pnpm --filter @vuelor/gradient build

      - name: Test packages
        run: |
          pnpm --filter @vuelor/picker test
          pnpm --filter @vuelor/gradient test

      # Each package publishes only when its package.json version is not on npm
      # yet, so a picker-only or gradient-only release (or a re-run) never fails
      # on an already-published sibling.
      - name: Publish @vuelor/picker to npm
        working-directory: packages/picker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "$NAME@$VERSION is already on npm — skipping."
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @vuelor/gradient to npm
        working-directory: packages/gradient
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "$NAME@$VERSION is already on npm — skipping."
          else
            pnpm publish --access public --no-git-checks
          fi

  # After the packages are published, pin the registry to them, regenerate, and commit back
  # to main, then deploy so the live registry is rebuilt against the new releases.
  sync-registry:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      # Needed to dispatch the deploy workflow below.
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin registry to the released package versions
        run: |
          PICKER=$(node -p "require('./packages/picker/package.json').version")
          GRADIENT=$(node -p "require('./packages/gradient/package.json').version")
          echo "Pinning registry to @vuelor/picker@^$PICKER and @vuelor/gradient@^$GRADIENT"
          sed -i "s/export const PICKER_VERSION = '[^']*'/export const PICKER_VERSION = '^$PICKER'/" docs/registry.config.mjs
          sed -i "s/export const GRADIENT_VERSION = '[^']*'/export const GRADIENT_VERSION = '^$GRADIENT'/" docs/registry.config.mjs

      - name: Regenerate registry
        run: pnpm --filter docs registry:build

      - name: Commit and push if changed
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.config.mjs docs/registry.json docs/registry docs/content/public/r
          if git diff --staged --quiet; then
            echo "Registry already up to date — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            PICKER=$(node -p "require('./packages/picker/package.json').version")
            GRADIENT=$(node -p "require('./packages/gradient/package.json').version")
            git commit -m "chore(registry): regenerate for @vuelor/picker@$PICKER and @vuelor/gradient@$GRADIENT"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push authenticated with GITHUB_TOKEN does not start other workflow runs -
      # GitHub suppresses them to prevent loops - so the commit above never reaches
      # the live site through Deploy's `on: push` trigger. workflow_dispatch is an
      # explicit exception to that rule, so dispatch the deploy directly. Only when
      # something was actually pushed: with nothing to commit, main is unchanged and
      # whatever push put the release commit there has already deployed it.
      - name: Deploy the regenerated registry
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
