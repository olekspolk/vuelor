<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a68"/>
      <stop offset="1" stop-color="#ee3c4b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffaa63"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d45ae0"/>
      <stop offset="1" stop-color="#c44bd1" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#1a1a1a"/>
    <!-- Aurora curtains hanging from the top edge. -->
    <g filter="url(#soft)">
      <rect x="-2" y="-8" width="13" height="34" fill="url(#ember)"/>
      <rect x="12" y="-10" width="10" height="26" fill="url(#violet)"/>
      <rect x="24" y="-6" width="13" height="40" fill="url(#ember)"/>
      <rect x="38" y="-10" width="10" height="28" fill="url(#amber)"/>
      <rect x="49" y="-7" width="13" height="34" fill="url(#ember)"/>
    </g>
    <!-- The V, crisp over the glow. -->
    <path d="M17 25 32 53 47 25" fill="none" stroke="#f3efec" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
